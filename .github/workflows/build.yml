name: Build APK and AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No KEYSTORE_BASE64 secret. Builds are signed with a debug key and cannot be uploaded to Google Play."
          fi

      - name: Build APK and AAB
        env:
          VERSION_CODE: ${{ github.run_number }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/PartyLights-1.0.${{ github.run_number }}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "out/PartyLights-1.0.${{ github.run_number }}.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: PartyLights-1.0.${{ github.run_number }}
          path: out/*

      - name: Publish release with APK and AAB
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Party Lights 1.0.${{ github.run_number }}
          body: |
            **APK** – install on your phone to test.
            **AAB** – upload to Google Play Console.
          files: out/*
